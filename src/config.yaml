# Site-wide, language-independent settings.
# Localized strings live in src/i18n/ui.ts; page copy lives in src/content-data/.
site:
  name: IMOTEK
  site: 'https://imotek.tr'
  base: '/'
  trailingSlash: true

# Default SEO metadata (each page passes its own title and description)
metadata:
  title:
    default: IMOTEK
    template: '%s | IMOTEK'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: IMOTEK
    images:
      - url: '~/assets/images/og-default.png'
        width: 1200
        height: 630
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: tr
  textDirection: ltr

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
